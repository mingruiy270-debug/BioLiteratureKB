[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biokb"
version = "0.1.0"
description = "BioLiteratureKB: local research literature knowledge base for the full research lifecycle (topic selection, design, analysis, writing, revision). Biomedicine out of the box; any domain (deep learning, ML, etc.) via customizable digest prompts. Zotero -> PDF -> Markdown -> Paper Digest -> FTS retrieval -> Agent skill."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "rapidfuzz",
    "python-dotenv",
    "requests",
    "tenacity",
    "typer",
    "rich",
    "pymupdf",
    "pymupdf4llm",
]

[project.optional-dependencies]
docling = ["docling"]
mineru = ["mineru"]
dev = ["pytest"]

[project.scripts]
biokb = "biokb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
